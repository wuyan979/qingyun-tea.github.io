    <div class="container">
        <div class="box"><h2>如何正确品茶</h2>
            <p>1. 观茶形：看茶叶外形、色泽、整碎度。</p>
            <p>2. 闻茶香：热闻清香，冷闻留香。</p>
            <p>3. 品茶味：小口啜饮，感受苦涩、甘甜、生津。</p>
            <p>4. 看叶底：泡后观察茶叶柔软度与色泽。</p>
            <p>5. 不同茶用不同水温：绿茶80℃，红茶95℃，乌龙茶100℃。</p>
