    <div class="container">
        <div class="box"><h2>六大茶类介绍</h2>
            <p><strong>绿茶：</strong>不发酵茶，清汤绿叶，代表：龙井、碧螺春。</p>
            <p><strong>红茶：</strong>全发酵茶，红汤红叶，代表：祁门红茶、正山小种。</p>
            <p><strong>乌龙茶：</strong>半发酵茶，香气高扬，代表：铁观音、大红袍。</p>
            <p><strong>白茶：</strong>微发酵茶，自然晾晒，清甜鲜爽。</p>
            <p><strong>黄茶：</strong>轻发酵茶，黄叶黄汤，滋味醇和。</p>
            <p><strong>黑茶：</strong>后发酵茶，越陈越香，代表：普洱、六堡茶。</p>
